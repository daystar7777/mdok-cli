name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run (e.g. publish current version to GPR)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one OS failing must not cancel the others
      matrix:
        include:
          # macOS arm64 runner cross-builds both mac binaries (bun cross-compile)
          - os: macos-14
            targets: "bun-darwin-arm64:mdok-macos-arm64 bun-darwin-x64:mdok-macos-x64"
          - os: ubuntu-22.04
            targets: "bun-linux-x64:mdok-linux-x64"
          - os: windows-2022
            targets: "bun-windows-x64:mdok-windows-x64.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Build binaries
        shell: bash
        run: |
          for pair in ${{ matrix.targets }}; do
            target="${pair%%:*}"
            name="${pair##*:}"
            bun build --compile --target "$target" src/index.ts --outfile "$name"
          done
      - name: Smoke test (native arch only; cross-built binaries can't execute here)
        shell: bash
        run: |
          host="$(uname -m)"
          for pair in ${{ matrix.targets }}; do
            target="${pair%%:*}"
            name="${pair##*:}"
            case "$target" in *-arm64) want=arm64;; *) want=x64;; esac
            have=x64; [ "$host" = "arm64" ] && have=arm64
            if [ "$want" != "$have" ]; then echo "skip smoke $name (cross-built)"; continue; fi
            ./"$name" --help >/dev/null
            ./"$name" lint README.md
          done
      - uses: actions/upload-artifact@v5
        with:
          name: bins-${{ matrix.os }}
          path: mdok-*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum mdok-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mdok-*

  # Mirror the npm package to GitHub Packages (npm.pkg.github.com).
  # Needs no secrets: GITHUB_TOKEN is provided automatically.
  publish-gpr:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@daystar7777"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
